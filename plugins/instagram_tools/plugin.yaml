name: instagram-tools
kind: backend
version: 1.0.0
description: >
  Instagram DM/comment tools for this agent's social-selling skill: reading
  new signals, qualifying them, and sending an owner-approved reply via the
  official Meta API. Nothing here ever sends without the model having first
  gotten the owner's explicit approval in this conversation.
author: Diogo Vargas
provides_tools:
  - instagram_fetch_signals
  - instagram_qualify
  - instagram_send_reply
